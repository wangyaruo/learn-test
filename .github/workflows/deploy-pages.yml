name: 发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: 题库校验
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 校验题库与脚本（不通过则中止发布）
        run: node scripts/check-bank.js

  deploy:
    name: 发布到 Pages
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 组装发布目录
        run: |
          mkdir -p _site
          cp index.html interview-trainer.html .nojekyll _site/
          echo "发布内容："
          ls -la _site

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点文件
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
