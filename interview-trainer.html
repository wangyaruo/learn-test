{c:'algo', lv:'基础', q:'数组去重，你能写出几种方式？',
 h:'从"利用 ES6 新结构"和"利用对象/Map 记录"两个方向想，注意 NaN 和对象的处理。',
 a:`<p><b>方式一：Set（最简洁）</b></p>
<pre><code>const uniq = arr =&gt; [...new Set(arr)];
// 注意：Set 用 SameValueZero 比较，能正确去重 NaN，但无法区分内容相同的不同对象</code></pre>
<p><b>方式二：filter + indexOf</b></p>
<pre><code>const uniq = arr =&gt; arr.filter((v, i) =&gt; arr.indexOf(v) === i);
// 问题：indexOf 用 === 比较，NaN 无法去重；时间复杂度 O(n²)</code></pre>
<p><b>方式三：Map 记录（O(n)，可处理复杂类型）</b></p>
<pre><code>function uniqBy(arr, keyFn) {
  const map = new Map();
  for (const item of arr) {
    const k = keyFn ? keyFn(item) : item;
    if (!map.has(k)) map.set(k, item);
  }
  return [...map.values()];
}
// 按对象 id 去重
uniqBy(list, o =&gt; o.id);</code></pre>
<p><b>复杂度对比：</b>Set 与 Map 方案是 O(n)，filter + indexOf 是 O(n²)。数据量大时必须用前者。</p>`},

{c:'algo', lv:'基础', q:'两数之和：给定数组和目标值，找出两个数使其和为 target。',
 h:'暴力双层循环是 O(n²)；用哈希表把"查找补数"降到 O(1)。',
 a:`<p><b>解法：哈希表（推荐，时间 O(n)，空间 O(n)）</b></p>
<pre><code>function twoSum(nums, target) {
  const map = new Map();          // 值 -&gt; 下标
  for (let i = 0; i &lt; nums.length; i++) {
    const need = target - nums[i];
    if (map.has(need)) return [map.get(need), i];
    map.set(nums[i], i);
  }
  return [];
}
twoSum([2, 7, 11, 15], 9);  // [0, 1]</code></pre>
<p><b>思路：</b>遍历时先判断"我还差多少"是否已经在表里，再把自己存进去。这样一次遍历即可，且天然避免元素重复使用（自己还没入库）。</p>
<p><b>暴力解法：</b>双层循环枚举所有组合，时间 O(n²)，空间 O(1)。面试时应先说出暴力解，再给出优化过程，体现思考路径。</p>`},

{c:'algo', lv:'基础', q:'判断字符串是否为回文，并实现字符串反转。',
 h:'双指针从两端向中间逼近，或者利用数组方法。',
 a:`<p><b>字符串反转</b></p>
<pre><code>const reverse = s =&gt; s.split('').reverse().join('');
// 或用扩展运算符：[...s].reverse().join('')，能正确处理 emoji 等代理对</code></pre>
<p><b>回文判断：双指针（推荐，O(n) 时间、O(1) 空间）</b></p>
<pre><code>function isPalindrome(s) {
  let l = 0, r = s.length - 1;
  while (l &lt; r) {
    if (s[l] !== s[r]) return false;
    l++; r--;
  }
  return true;
}</code></pre>
<p><b>进阶版本：</b>忽略大小写、空格与标点（LeetCode 125）。</p>
<pre><code>function isPalindrome2(s) {
  const t = s.toLowerCase().replace(/[^a-z0-9]/g, '');
  return t === [...t].reverse().join('');
}</code></pre>
<p><b>复杂度：</b>双指针时间 O(n)、额外空间 O(1)；反转法时间 O(n)、空间 O(n)。</p>`},

{c:'algo', lv:'高频', q:'实现数组扁平化（flatten），并支持指定深度。',
 h:'递归是最直观的；也可以用 reduce、栈或 ES6 的 flat。',
 a:`<p><b>递归（最易理解）</b></p>
<pre><code>function flatten(arr, depth = Infinity) {
  const res = [];
  for (const item of arr) {
    if (Array.isArray(item) &amp;&amp; depth &gt; 0) {
      res.push(...flatten(item, depth - 1));
    } else {
      res.push(item);
    }
  }
  return res;
}
flatten([1, [2, [3, [4]]]]);        // [1, 2, 3, 4]
flatten([1, [2, [3, [4]]]], 2);     // [1, 2, 3, [4]]</code></pre>
<p><b>reduce 版本</b></p>
<pre><code>const flatten = (arr, d = Infinity) =&gt;
  d &gt; 0
    ? arr.reduce((acc, v) =&gt; acc.concat(Array.isArray(v) ? flatten(v, d - 1) : v), [])
    : arr.slice();</code></pre>
<p><b>其他方式：</b>原生 <code>arr.flat(depth)</code> 最简洁；stack 迭代版可以避免深层嵌套的栈溢出。</p>
<p><b>复杂度：</b>时间 O(n × 深度)，空间递归版本为 O(深度) 栈空间。注意空数组元素（稀疏数组）的处理差异。</p>`},

{c:'algo', lv:'高频', q:'快速排序的原理是什么？手写实现并分析复杂度。',
 h:'选基准值，分区，递归。关键是分区函数怎么写。',
 a:`<pre><code>function quickSort(arr) {
  if (arr.length &lt;= 1) return arr;
  const [pivot, ...rest] = arr;
  const left = [], right = [];
  for (const n of rest) {
    n &lt; pivot ? left.push(n) : right.push(n);
  }
  return [...quickSort(left), pivot, ...quickSort(right)];
}</code></pre>
<p><b>原地分区版本（省空间，工程中更常用）</b></p>
<pre><code>function quickSortInPlace(arr, lo = 0, hi = arr.length - 1) {
  if (lo &gt;= hi) return arr;
  const pivot = arr[hi];
  let i = lo;
  for (let j = lo; j &lt; hi; j++) {
    if (arr[j] &lt; pivot) { [arr[i], arr[j]] = [arr[j], arr[i]]; i++; }
  }
  [arr[i], arr[hi]] = [arr[hi], arr[i]];
  quickSortInPlace(arr, lo, i - 1);
  quickSortInPlace(arr, i + 1, hi);
  return arr;
}</code></pre>
<p><b>复杂度：</b>平均时间 O(n log n)，最坏 O(n²)（数组已基本有序且固定取末尾为基准时）。空间复杂度 O(log n) 递归栈。</p>
<p><b>优化手段：</b>① 随机选基准或三数取中，避免最坏情况；② 小数组（长度 &lt; 10）切换插入排序；③ 三路分区处理大量重复元素。</p>
<p><b>稳定性：</b>快排不稳定。需要稳定排序时用归并排序。</p>`},

{c:'algo', lv:'基础', q:'二分查找的边界条件怎么写才不会出错？',
 h:'关键是区间定义：决定用 while (l <= r) 还是 while (l < r)。',
 a:`<p><b>标准版本（闭区间 [left, right]）</b></p>
<pre><code>function binarySearch(nums, target) {
  let left = 0, right = nums.length - 1;   // 闭区间
  while (left &lt;= right) {                   // 区间非空才继续
    const mid = left + ((right - left) &gt;&gt; 1); // 防止 (l+r) 溢出
    if (nums[mid] === target) return mid;
    if (nums[mid] &lt; target) left = mid + 1;   // 目标在右半区
    else right = mid - 1;                     // 目标在左半区
  }
  return -1;
}</code></pre>
<p><b>边界口诀：</b>区间定义决定循环条件与收缩方式，两者必须配套。闭区间 [l, r] 配 <code>while (l &lt;= r)</code>，缩小时 l = mid + 1、r = mid - 1；左闭右开 [l, r) 配 <code>while (l &lt; r)</code>，缩小时 r = mid。混用就会死循环或漏查。</p>
<p><b>前提：</b>数组必须有序。时间 O(log n)，空间 O(1)。</p>
<p><b>变体：</b>查找左边界（第一个等于 target 的位置）、右边界，此时命中时不立即返回，而是继续收缩区间。这类题（如 LeetCode 34）是考察重点。</p>`},

{c:'algo', lv:'基础', q:'冒泡排序怎么实现？常见排序算法的复杂度分别是多少？',
 h:'记住"比较 - 交换 - 提前退出优化"，复杂度要能表格化说清。',
 a:`<pre><code>function bubbleSort(arr) {
  for (let i = 0; i &lt; arr.length - 1; i++) {
    let swapped = false;
    for (let j = 0; j &lt; arr.length - 1 - i; j++) {
      if (arr[j] &gt; arr[j + 1]) {
        [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
        swapped = true;
      }
    }
    if (!swapped) break;   // 优化：本轮无交换说明已有序
  }
  return arr;
}</code></pre>
<p><b>复杂度对比：</b></p>
<ul>
<li>冒泡：平均 / 最坏 O(n²)，最好 O(n)（已有序 + 提前退出），空间 O(1)，<b>稳定</b></li>
<li>插入：平均 O(n²)，最好 O(n)，空间 O(1)，<b>稳定</b>。小数组和近乎有序时表现最好</li>
<li>选择：始终 O(n²)，空间 O(1)，<b>不稳定</b></li>
<li>归并：始终 O(n log n)，空间 O(n)，<b>稳定</b></li>
<li>快排：平均 O(n log n)，最坏 O(n²)，空间 O(log n)，<b>不稳定</b></li>
<li>堆排：始终 O(n log n)，空间 O(1)，<b>不稳定</b></li>
</ul>
<p><b>稳定性含义：</b>相等元素的相对顺序是否保持不变。多字段排序时会用到。</p>`},

{c:'algo', lv:'基础', q:'斐波那契数列有哪几种实现方式？如何优化？',
 h:'朴素递归的问题在于大量重复计算，用记忆化或迭代解决。',
 a:`<p><b>朴素递归（反面教材，O(2^n)）</b></p>
<pre><code>const fib = n =&gt; n &lt;= 1 ? n : fib(n - 1) + fib(n - 2);
// fib(40) 已经需要几秒，因为同一子问题被重复计算</code></pre>
<p><b>记忆化递归（自顶向下）</b></p>
<pre><code>function fib(n, memo = {}) {
  if (n &lt;= 1) return n;
  if (memo[n] !== undefined) return memo[n];
  return memo[n] = fib(n - 1, memo) + fib(n - 2, memo);
}</code></pre>
<p><b>迭代 + 滚动变量（最优，O(n) 时间、O(1) 空间）</b></p>
<pre><code>function fib(n) {
  let a = 0, b = 1;
  for (let i = 0; i &lt; n; i++) [a, b] = [b, a + b];
  return a;
}</code></pre>
<p><b>本质：</b>朴素递归慢的根因是重叠子问题，记忆化把指数级降到线性。这正是动态规划的核心思想——用空间换时间避免重复计算。</p>
<p><b>进阶：</b>n 很大时（如 10^9）可用矩阵快速幂做到 O(log n)，或用通项公式（浮点精度不可靠）。</p>`},

{c:'algo', lv:'进阶', q:'手写 Promise.all，需要处理非 Promise 元素和失败短路。',
 h:'返回新 Promise，用计数器判断是否全部完成；任一失败立即 reject。',
 a:`<pre><code>function myPromiseAll(iterable) {
  return new Promise((resolve, reject) =&gt; {
    const items = [...iterable];
    const result = new Array(items.length);
    let count = 0;
    if (items.length === 0) return resolve(result);

    items.forEach((item, i) =&gt; {
      // Promise.resolve 统一处理普通值
      Promise.resolve(item).then(
        value =&gt; {
          result[i] = value;              // 按原顺序存放
          if (++count === items.length) resolve(result);
        },
        err =&gt; reject(err)                // 短路：第一个失败即整体失败
      );
    });
  });
}</code></pre>
<p><b>易错点：</b></p>
<ul>
<li>必须用索引 i 写入结果，保证输出顺序与输入一致，而不是按完成顺序</li>
<li>用 Promise.resolve 包装，普通值也能处理</li>
<li>空数组要立即 resolve（而不是永远 pending）</li>
<li>必须先判断长度再 forEach，否则计数器永远不会等于 0 之外的判断值</li>
</ul>
<p><b>对比 allSettled：</b>如果需要"失败也要拿到全部结果"，应改为记录每个 { status, value/reason }，不短路。</p>`},

{c:'algo', lv:'进阶', q:'手写 new 操作符，说说它做了哪几件事。',
 h:'创建对象 → 链接原型 → 绑定 this 执行 → 根据返回值决定返回谁。',
 a:`<pre><code>function myNew(Ctor, ...args) {
  if (typeof Ctor !== 'function') throw new TypeError('not a constructor');
  // 1. 创建一个以 Ctor.prototype 为原型的对象
  const obj = Object.create(Ctor.prototype);
  // 2. 执行构造函数，this 指向新对象
  const result = Ctor.apply(obj, args);
  // 3. 如果构造函数返回了对象，则以该对象为准；否则返回新对象
  return (result !== null &amp;&amp; (typeof result === 'object' || typeof result === 'function'))
    ? result : obj;
}</code></pre>
<pre><code>function Person(name) { this.name = name; }
Person.prototype.say = function(){ return this.name; };
const p = myNew(Person, 'Tom');
p.say();            // 'Tom'
p instanceof Person // true</code></pre>
<p><b>四个步骤（面试要直接说出来）：</b></p>
<ol>
<li>创建一个空对象</li>
<li>把该对象的 [[Prototype]] 指向构造函数的 prototype</li>
<li>以该对象为 this 执行构造函数</li>
<li>构造函数返回对象则返回该对象，否则返回步骤 1 创建的对象</li>
</ol>
<p><b>细节：</b>Object.create(proto) 比 obj.__proto__ = proto 更规范；new.target 在构造函数内部可判断是否被 new 调用。</p>`},

{c:'algo', lv:'进阶', q:'手写 instanceof，原理是什么？',
 h:'沿左侧对象的原型链向上查找，看是否出现右侧构造函数的 prototype。',
 a:`<pre><code>function myInstanceof(left, right) {
  if (left === null || (typeof left !== 'object' &amp;&amp; typeof left !== 'function')) return false;
  const target = right.prototype;
  let proto = Object.getPrototypeOf(left);
  while (proto !== null) {
    if (proto === target) return true;
    proto = Object.getPrototypeOf(proto);
  }
  return false;
}</code></pre>
<pre><code>myInstanceof([], Array);       // true
myInstanceof([], Object);      // true（原型链向上会到达 Object.prototype）
myInstanceof(1, Number);       // false（基本类型直接返回 false）</code></pre>
<p><b>与 typeof 的差异：</b>typeof 判断基本类型，instanceof 判断引用类型的继承关系。判断数组应优先用 Array.isArray()，它能正确处理跨 iframe 场景（instanceof 在跨 Realm 时会失效，因为不同窗口的 Array 是不同的构造函数）。</p>`},

{c:'algo', lv:'进阶', q:'最长无重复字符子串（滑动窗口）。',
 h:'用左右指针维护一个无重复的窗口，右指针扩展，遇到重复就移动左指针。',
 a:`<pre><code>function lengthOfLongestSubstring(s) {
  const map = new Map();     // 字符 -&gt; 最近出现的下标
  let max = 0, left = 0;
  for (let right = 0; right &lt; s.length; right++) {
    const ch = s[right];
    // 若该字符在窗口内出现过，左边界跳到它上一次出现位置的下一格
    if (map.has(ch) &amp;&amp; map.get(ch) &gt;= left) {
      left = map.get(ch) + 1;
    }
    map.set(ch, right);
    max = Math.max(max, right - left + 1);
  }
  return max;
}
lengthOfLongestSubstring('abcabcbb');  // 3 ('abc')
lengthOfLongestSubstring('pwwkew');    // 3 ('wke')</code></pre>
<p><b>复杂度：</b>时间 O(n)（每个字符最多被访问两次），空间 O(min(n, 字符集大小))。</p>
<p><b>易错点：</b>判断条件是 <code>map.get(ch) &gt;= left</code>，必须加与左边界的比较。否则遇到 '<b>abba</b>' 这类用例时，左指针会被错误地回退到一个已经不在窗口内的旧下标上。</p>`},

{c:'algo', lv:'基础', q:'有效括号匹配：判断字符串中的括号是否合法。',
 h:'用栈：遇左括号入栈，遇右括号检查栈顶是否匹配。',
 a:`<pre><code>function isValid(s) {
  const stack = [];
  const pairs = { ')': '(', ']': '[', '}': '{' };
  for (const ch of s) {
    if (ch === '(' || ch === '[' || ch === '{') {
      stack.push(ch);
    } else {
      if (stack.pop() !== pairs[ch]) return false;  // 栈空时 pop 返回 undefined，同样不匹配
      }
  }
  return stack.length === 0;   // 栈必须为空才算匹配完成
}</code></pre>
<pre><code>isValid('()[]{}');  // true
isValid('([)]');    // false
isValid('(');       // false</code></pre>
<p><b>复杂度：</b>时间 O(n)，空间 O(n)。</p>
<p><b>为什么用栈：</b>括号匹配具有"后进先出"的特征——最后打开的括号必须最先闭合，正好对应栈的结构。这类题是栈的典型应用，同理还有"逆波兰表达式求值"、"每日温度"。</p>`},

{c:'algo', lv:'进阶', q:'求数组中第 K 大的元素，如何做到平均 O(n)？',
 h:'快速选择（Quick Select）：快排的分区思想，但只递归一侧。',
 a:`<pre><code>function findKthLargest(nums, k) {
  const target = nums.length - k;         // 第 k 大 = 升序后的第 n-k 个
  let left = 0, right = nums.length - 1;
  while (left &lt;= right) {
    const p = partition(nums, left, right);
    if (p === target) return nums[p];
    if (p &lt; target) left = p + 1;
    else right = p - 1;                   // 只处理一侧，另一侧丢弃
  }
}
function partition(nums, lo, hi) {
  const pivot = nums[hi];
  let i = lo;
  for (let j = lo; j &lt; hi; j++) {
    if (nums[j] &lt; pivot) { [nums[i], nums[j]] = [nums[j], nums[i]]; i++; }
  }
  [nums[i], nums[hi]] = [nums[hi], nums[i]];
  return i;
}</code></pre>
<p><b>复杂度：</b>平均 O(n)（每次只递归一半，n + n/2 + n/4 + ... = 2n），最坏 O(n²)（基准选择极差时）。空间 O(1)。</p>
<p><b>其他解法对比：</b><p></p>
<ul>
<li>排序后取下标：O(n log n)，代码最简单，面试可先说这个</li>
<li>小顶堆维护 k 个元素：O(n log k)，适合数据量大、k 较小的流式场景（如"10 亿个数取前 100 大"）</li>
<li>快速选择：平均最优，但会修改原数组</li>
</ul>
<p><b>注意：</b>快速选择与快排的区别在于只递归包含目标下标的那一侧。这是把 O(n log n) 降到平均 O(n) 的关键。</p>`},

{c:'algo', lv:'进阶', q:'二叉树的层序遍历（BFS）怎么实现？',
 h:'用队列，每轮先记录当前层的节点数量。',
 a:`<pre><code>function levelOrder(root) {
  if (!root) return [];
  const res = [];
  const queue = [root];
  while (queue.length) {
    const level = [];
    const size = queue.length;          // 关键：先固定本层节点数
    for (let i = 0; i &lt; size; i++) {
      const node = queue.shift();
      level.push(node.val);
      if (node.left) queue.push(node.left);
      if (node.right) queue.push(node.right);
    }
    res.push(level);
  }
  return res;
}</code></pre>
<p><b>要点：</b>必须先用 size 缓存本层节点数。如果在循环里直接用 queue.length，新入队的子节点会被算进当前层，导致层级错乱。</p>
<p><b>前中后序遍历（DFS 递归）</b></p>
<pre><code>function inorder(root, res = []) {
  if (!root) return res;
  inorder(root.left, res);
  res.push(root.val);
  inorder(root.right, res);
  return res;
}</code></pre>
<p><b>复杂度：</b>BFS 与 DFS 都是时间 O(n)、空间 O(n)（BFS 队列最大宽度，DFS 递归栈最大深度）。</p>
<p><b>工程应用：</b>层序遍历是很多树形结构题的基础，如"树的最大深度"、"锯齿形层序遍历"、"判断完全二叉树"。组件树渲染、目录树遍历都用得到。</p>`},

{c:'algo', lv:'基础', q:'合并两个有序数组（原地合并）。',
 h:'从后往前比较，避免覆盖未处理的元素。',
 a:`<pre><code>// nums1 长度为 m+n，前 m 个有效；nums2 长度 n。合并到 nums1 中
function merge(nums1, m, nums2, n) {
  let i = m - 1, j = n - 1, k = m + n - 1;
  while (j &gt;= 0) {                        // nums2 处理完即可结束
    if (i &gt;= 0 &amp;&amp; nums1[i] &gt; nums2[j]) {
      nums1[k--] = nums1[i--];
    } else {
      nums1[k--] = nums2[j--];
    }
  }
  return nums1;
}
merge([1,2,3,0,0,0], 3, [2,5,6], 3);   // [1,2,2,3,5,6]</code></pre>
<p><b>为什么从后往前：</b>nums1 后半段是空位，从后往前填充不会覆盖尚未比较的元素。如果从前往后，要么需要额外数组，要么就要频繁搬移元素。</p>
<p><b>复杂度：</b>时间 O(m + n)，空间 O(1)。</p>
<p><b>循环条件为什么是 j &gt;= 0：</b>nums2 全部合并完即任务完成；而 nums1 剩余元素本来就在正确位置，无需处理。这是本题的精妙之处。</p>`},

/* ---------- 概念理解 ---------- */
{c:'concept', lv:'基础', q:'MVC、MVP、MVVM 有什么区别？',
 h:'区别在于各层之间的通信方向与耦合方式，尤其是 View 和 Model 是否直接接触。',
 a:`<ul>
<li><b>MVC（Model-View-Controller）：</b>用户操作触发 Controller，Controller 更新 Model，Model 变化后通知 View 更新。View 与 Model 可以存在直接联系。Backbone 是典型实现。缺点是 View 与 Model 耦合，大型项目中 Controller 容易变臃肿。</li>
<li><b>MVP（Model-View-Presenter）：</b>View 与 Model 完全解耦，所有交互都经过 Presenter。Presenter 持有 View 的引用并主动调用其方法更新界面。View 变成被动视图，"数据绑定"全手工。测试友好但样板代码多，Android 开发中常见。</li>
<li><b>MVVM（Model-View-ViewModel）：</b>核心是<b>双向数据绑定</b>。ViewModel 暴露数据给 View，View 的改动也能自动同步回 ViewModel，中间的同步由框架的响应式系统完成，开发者无需手动操作 DOM。Vue、Angular 属此类。<b>本质是 MVP 的改进版，把同步逻辑自动化了。</b></li>
</ul>
<p><b>一句话记忆：</b>MVC 的 C 可以双向联系 View 与 Model；MVP 的 P 单向协调且持有 View；MVVM 的 VM 依靠数据绑定自动同步，是 M 与 V 之间的"翻译层"。</p>
<p><b>实际项目影响：</b>MVVM 解放了手工 DOM 操作，但双向绑定在复杂表单里可能带来数据流向不清晰的问题，因此 React 选择了单向数据流路线（它是 View 层库，严格说不属于 MVVM）。</p>`},

{c:'concept', lv:'高频', q:'什么是虚拟 DOM？它真的比直接操作 DOM 快吗？',
 h:'重点是"批量最小化更新"和"跨平台能力"，而不是绝对速度。',
 a:`<p><b>定义：</b>用 JS 对象描述真实 DOM 的结构（tag、props、children），这份对象树就是虚拟 DOM。更新时先在内存中对比新旧两棵树的差异（diff），算出最小变更集合，再一次性应用到真实 DOM。</p>
<pre><code>// 虚拟 DOM 节点的形态
{ type: 'div', props: { class: 'box' }, children: ['hello'] }</code></pre>
<p><b>它解决的问题：</b></p>
<ol>
<li><b>避免手写复杂的 DOM 操作代码。</b>开发者只描述"状态对应什么界面"，由框架负责映射为 DOM 操作，降低心智负担与出错概率。</li>
<li><b>批量最小化更新。</b>手动操作 DOM 容易触发多次重排重绘；虚拟 DOM 把多次状态变更合并，一次性 diff 后只更新真正变化的部分。</li>
<li><b>跨平台能力。</b>同一套虚拟 DOM 可以渲染到浏览器、小程序、Native（React Native）、Canvas 等不同宿主环境，只需替换渲染器。</li>
</ol>
<p><b>"比原生快吗"——不准确。</b>虚拟 DOM 本身有 diff 的计算开销，单次更新往往比精心手写的最优 DOM 操作更慢。它的价值在于：让普通水平的开发者也能以可接受的性能写复杂界面，且性能下限较高、可预期，而手写 DOM 的性能方差极大。</p>
<p><b>补充：</b>React 使用 Fiber 架构，把渲染工作拆成可中断的小任务，避免长任务阻塞主线程；Vue3 编译期做静态提升与补丁标记（Patch Flag），尽量减少运行时 diff 的成本。</p>`},

{c:'concept', lv:'进阶', q:'前端路由的实现原理是什么？hash 模式和 history 模式有什么区别？',
 h:'一个靠监听 hashchange，一个靠 history API + 服务端配置。',
 a:`<p><b>本质：</b>前端路由的核心是"监听 URL 变化 → 匹配路由表 → 渲染对应组件"，整个过程不向服务器发请求（或不整页刷新）。</p>
<p><b>hash 模式：</b>利用 URL 中 # 后面的部分。hash 变化不会触发页面刷新，也不会发送到服务器。</p>
<pre><code>window.addEventListener('hashchange', () =&gt; {
  const path = location.hash.slice(1);   // '#/user' -&gt; '/user'
  render(path);
});
// 跳转
location.hash = '/user';</code></pre>
<ul>
<li>优点：兼容性好，无需服务端配置，刷新不会 404。</li>
<li>缺点：URL 带 #，不够美观；对 SEO 不友好；锚点定位功能会与之冲突。</li>
</ul>
<p><b>history 模式：</b>使用 pushState / replaceState 修改 URL，配合 popstate 事件监听前进后退。</p>
<pre><code>history.pushState({}, '', '/user');    // 修改 URL 但不发请求
window.addEventListener('popstate', () =&gt; render(location.pathname));</code></pre>
<ul>
<li>优点：URL 干净，更符合传统路径习惯，利于 SEO。</li>
<li>缺点：<b>刷新页面会 404</b>，因为服务器上没有 /user 这个真实资源。必须在服务端配置 fallback，把所有未匹配的路径都返回 index.html（Nginx 用 try_files，Vite 的 historyApiFallback）。</li>
</ul>
<p><b>选择建议：</b>内部系统、无服务端配置权限时用 hash；对外站点、需要 SEO 时用 history，并确保部署配置正确。</p>`},

{c:'concept', lv:'进阶', q:'CSR、SSR、SSG、ISR 分别是什么？各自适用什么场景？',
 h:'核心差异是"HTML 在什么时间、由谁生成"。',
 a:`<ul>
<li><b>CSR（客户端渲染）：</b>服务器只返回空的 HTML 壳，JS 下载执行后才渲染出内容。首屏慢、SEO 差；但前后端分离彻底、交互流畅、部署简单（纯静态）。适合后台管理系统、登录后的应用。</li>
<li><b>SSR（服务端渲染）：</b>每次请求时服务器实时生成完整 HTML 返回，浏览器拿到即可显示内容，随后 JS "注水"（hydration）接管交互。优势是首屏快、SEO 好；代价是服务器压力大、TTFB 受服务端性能影响、需要处理注水不一致问题。适合内容型站点、电商（如 Next.js、Nuxt）。</li>
<li><b>SSG（静态站点生成）：</b>构建时就把所有页面渲染成静态 HTML，部署到 CDN。速度最快、成本最低、最稳定。缺点是内容更新需要重新构建。适合博客、文档、营销页（如 Astro、VitePress）。</li>
<li><b>ISR（增量静态再生成）：</b>Next.js 提出的折中方案。页面以静态形式提供，但可按设定的时间间隔在后台重新生成，兼顾静态性能与内容时效。适合内容量大、更新频率中等的站点（新闻、商品列表）。</li>
</ul>
<p><b>选择逻辑：</b>内容是否因人而异（→ SSR）？是否频繁更新（→ ISR / SSR，否则 SSG）？是否需要登录后的强交互（→ CSR）？实践中常混合使用，例如首页 SSG、列表页 ISR、用户中心 CSR。</p>`},

{c:'concept', lv:'进阶', q:'JWT 是什么？它和 Session 有什么区别？',
 h:'状态存哪里：一个在客户端，一个在服务端。',
 a:`<p><b>JWT（JSON Web Token）：</b>由三段 Base64 组成——Header.Payload.Signature。服务端用密钥对前两段签名，客户端携带后在服务端验签即可确认身份，<b>服务端无需存储会话状态</b>。</p>
<pre><code>// PC 端携带方式
Authorization: Bearer &lt;token&gt;</code></pre>
<ul>
<li>Header：算法类型（如 HS256）</li>
<li>Payload：声明信息，如 sub、exp、角色。注意<b>只是 Base64 编码，不是加密</b>，任何人都能解开看，所以不能放敏感信息。</li>
<li>Signature：用密钥签名，防止篡改。改变 payload 会导致验签失败。</li>
</ul>
<p><b>与 Session 的对比：</b></p>
<ul>
<li><b>存储位置：</b>Session 数据存服务端（内存 / Redis），客户端只存 sessionId；JWT 数据全部在客户端，服务端只验签。</li>
<li><b>扩展性：</b>JWT 天然适合分布式与跨域场景，无需共享会话存储；Session 在多实例部署时需要 Redis 等集中存储。</li>
<li><b>撤销能力：</b>Session 删除服务端记录即失效；JWT 一旦签发，在过期前无法主动作废（这是最大痛点）。补救方案是维护黑名单，但那就又变成有状态了。</li>
<li><b>体积：</b>JWT 明显更大，每个请求都携带会增加流量。</li>
</ul>
<p><b>实践建议：</b>Access Token 短有效期（如 15 分钟）+ Refresh Token 长有效期（存 HttpOnly Cookie，只能用于换新 token）。如果业务需要"立即踢下线"、"单点登录互斥"，Session 或"JWT + 黑名单"更合适。</p>`},

{c:'concept', lv:'进阶', q:'WebSocket 和 HTTP 轮询有什么区别？WebSocket 的连接过程是怎样的？',
 h:'从"谁主动"和"连接是否长驻"两个角度区分。',
 a:`<p><b>HTTP 轮询：</b>客户端定时发请求问服务端有没有新数据。简单，但实时性差、无效请求多、服务端压力大。长轮询是改良版——服务端把请求挂起直到有数据或超时，实时性提升但连接占用仍在。</p>
<p><b>WebSocket：</b>基于 TCP 的全双工协议，一次握手后连接保持，双方可以随时主动推送。延迟低、开销小（无重复 HTTP 头）。</p>
<p><b>连接建立过程：</b>先发一个 HTTP 请求完成握手，然后协议升级。</p>
<pre><code>GET /chat HTTP/1.1
Host: example.com
Upgrade: websocket
Connection: Upgrade
Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==
Sec-WebSocket-Version: 13

// 服务端返回
HTTP/1.1 101 Switching Protocols
Upgrade: websocket
Connection: Upgrade
Sec-WebSocket-Accept: s3pPLMBiTxaQ9kYGzzhZRbK+xOo=</code></pre>
<p><b>适用场景：</b>WebSocket 适合聊天、协作编辑、实时行情、游戏、通知推送。如果只是偶发通知，SSE（Server-Sent Events）更简单——单向推送、基于 HTTP、自动重连；轮询则适合实时性要求不高的低频场景。</p>
<p><b>工程注意：</b>需要处理断线重连（指数退避）、心跳保活（防止中间代理断开空闲连接）、鉴权（token 通常放在握手 URL 或首条消息中）。</p>`},

{c:'concept', lv:'进阶', q:'什么是微前端？它解决了什么问题，又带来了什么代价？',
 h:'核心是"让多个独立团队的技术栈能组合成一个应用"，用隔离和集成换取自治。',
 a:`<p><b>定义：</b>把大型前端应用拆分成多个可以独立开发、独立部署、独立运行的子应用，再由一个主框架（基座）在运行时或构建时把它们组合成一个整体。</p>
<p><b>解决的核心问题：</b></p>
<ul>
<li>巨石应用的维护成本：代码库庞大、构建慢、改一处要全量回归。</li>
<li>多团队协作冲突：发布互相阻塞，无法独立上线。</li>
<li>技术栈迁移：老系统（如 jQuery / Vue2）想逐步迁到新技术栈，无法一次性重写。</li>
</ul>
<p><b>主流方案：</b></p>
<ul>
<li><b>运行时集成：</b>qiankun（基于 single-spa）、micro-app、Module Federation。基座在运行时加载子应用并挂载到指定容器。</li>
<li><b>构建时集成：</b>npm 包 / monorepo（pnpm workspace + Turborepo）。子应用以包形式被引入，集成简单但无法独立部署。</li>
<li><b>iframe：</b>隔离最彻底、实现最简单，但路由、弹窗、通信、性能体验都受限。</li>
</ul>
<p><b>代价（面试中要主动说）：</b></p>
<ul>
<li>JS 沙箱与 CSS 隔离难以做到完全可靠，全局变量和样式污染仍需人工规避。</li>
<li>公共依赖重复加载导致体积膨胀，需要共享依赖方案。</li>
<li>开发环境、调试链路、父子通信、路由同步复杂度显著上升。</li>
<li>团队需要额外的基建投入与规范约束。</li>
</ul>
<p><b>结论：</b>微前端是组织问题的技术解法，不是性能优化手段。团队规模不大、系统耦合度高时，monorepo 往往比微前端更划算。</p>`},

{c:'concept', lv:'基础', q:'PWA 是什么？Service Worker 的工作原理是怎样的？',
 h:'核心是"可离线、可安装"，靠 Service Worker 拦截请求实现。',
 a:`<p><b>PWA（渐进式 Web 应用）：</b>用一系列 Web 能力让网站具备接近原生应用的体验——离线可用、可添加到桌面、消息推送、后台同步。关键词是"渐进式"：能力可逐项叠加，不支持的环境自动降级。</p>
<p><b>Service Worker 是 PWA 的核心：</b>运行在浏览器后台的独立线程，充当网络代理，能拦截页面的所有请求并决定如何响应。</p>
<ul>
<li>它<b>不能直接访问 DOM</b>，与页面通过 postMessage 通信。</li>
<li>只在 HTTPS（或 localhost）下可用，因为权限极高。</li>
<li>生命周期：install（预缓存资源）→ waiting → activate（清理旧缓存）→ fetch（拦截请求）。</li>
</ul>
<pre><code>self.addEventListener('fetch', e =&gt; {
  e.respondWith(
    caches.match(e.request).then(cached =&gt; cached || fetch(e.request))
  );
});</code></pre>
<p><b>常用缓存策略：</b>Cache First（静态资源）、Network First（接口数据）、Stale While Revalidate（先返回缓存再后台更新）。</p>
<p><b>配套技术：</b>manifest.json 提供图标与名称以支持安装；Push API 实现消息推送；Workbox 是官方封装库，简化缓存策略编写。</p>
<p><b>局限：</b>iOS 支持较晚且能力受限；缓存更新策略若设计不当会导致用户长期拿到旧版本，是实践中最常见的坑。</p>`},

{c:'concept', lv:'基础', q:'前端常见的性能指标有哪些？Core Web Vitals 指什么？',
 h:'三个核心指标：LCP、INP、CLS，各自衡量不同维度的体验。',
 a:`<p><b>Core Web Vitals（Google 提出的核心体验指标）：</b></p>
<ul>
<li><b>LCP（Largest Contentful Paint）最大内容绘制：</b>首屏最大元素渲染完成的时间，衡量<b>加载速度</b>。良好标准 &lt; 2.5s。优化对象通常是首屏大图或大标题。</li>
<li><b>INP（Interaction to Next Paint）交互到下一帧绘制：</b>衡量页面响应交互的<b>流畅度</b>。良好标准 &lt; 200ms。2024 年起取代了 FID（首次输入延迟），因为 FID 只测第一次交互且只能测延迟，INP 覆盖全生命周期的所有交互。</li>
<li><b>CLS（Cumulative Layout Shift）累积布局偏移：</b>衡量页面<b>视觉稳定性</b>。良好标准 &lt; 0.1。图片未设尺寸、字体切换、动态插入广告或横幅是主要来源。</li>
</ul>
<p><b>其他常用指标：</b></p>
<ul>
<li>FP / FCP：首次绘制 / 首次内容绘制，衡量白屏时间。</li>
<li>TTFB：首字节时间，反映服务端与网络响应速度。</li>
<li>TBT：总阻塞时间，反映主线程被长任务占用的程度。</li>
</ul>
<p><b>采集方式：</b>实验室数据用 Lighthouse / Performance 面板；真实用户数据用 web-vitals 库上报或用 PerformanceObserver 监听。两者需结合——实验室便于定位问题，真实数据反映实际体验。</p>`},

/* ---------- END ---------- */
];

const CATS = {
  js:'JS 基础', css:'CSS', net:'浏览器与网络',
  fw:'Vue / React', eng:'工程化', algo:'算法手写', concept:'概念理解'
};
const LVS = ['基础','高频','进阶'];

BANK.forEach((q, i) => { q.id = i + 1; });

/* ---------------- 状态 ---------------- */
const LS = { seen:'ift_seen', star:'ift_star', theme:'ift_theme' };
const read = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const seen    = new Set(read(LS.seen, []));
const starred = new Set(read(LS.star, []));
const state   = { cat:'all', lv:'all', mode:'all', cur:null, hinted:false, answered:false };

const $ = id => document.getElementById(id);

/* ---------------- 过滤 ---------------- */
function pool() {
  return BANK.filter(q => {
    if (state.cat !== 'all' && q.c !== state.cat) return false;
    if (state.lv  !== 'all' && q.lv !== state.lv)  return false;
    if (state.mode === 'star' && !starred.has(q.id)) return false;
    if (state.mode === 'new'  && seen.has(q.id))     return false;
    return true;
  });
}

/* ---------------- 渲染筛选条 ---------------- */
function buildChips() {
  const catRow = $('catRow'), lvRow = $('lvRow'), modeRow = $('modeRow');
  catRow.innerHTML = '';
  const all = document.createElement('button');
  all.className = 'chip on'; all.dataset.v = 'all';
  all.innerHTML = '全部<span class="n">' + BANK.length + '</span>';
  catRow.appendChild(all);
  Object.keys(CATS).forEach(k => {
    const n = BANK.filter(q => q.c === k).length;
    if (!n) return;
    const b = document.createElement('button');
    b.className = 'chip'; b.dataset.v = k;
    b.innerHTML = CATS[k] + '<span class="n">' + n + '</span>';
    catRow.appendChild(b);
  });

  lvRow.innerHTML = '';
  [['all','全部'], ...LVS.map(l => [l, l])].forEach(([v, t]) => {
    const b = document.createElement('button');
    b.className = 'chip' + (v === 'all' ? ' on' : '');
    b.dataset.v = v; b.textContent = t;
    lvRow.appendChild(b);
  });

  const MODES = [['all','随机全部'],['new','只出没看过的'],['star','只看我的收藏']];
  modeRow.innerHTML = '';
  MODES.forEach(([v, t], i) => {
    const b = document.createElement('button');
    b.className = 'chip' + (i === 0 ? ' on' : '');
    b.dataset.v = v; b.textContent = t;
    modeRow.appendChild(b);
  });
}

function bindRow(rowId, key) {
  $(rowId).addEventListener('click', e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    [...b.parentNode.children].forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    state[key] = b.dataset.v;
    next(true);
  });
}

/* ---------------- 抽题 ---------------- */
let lastPick = [];
function next(fromFilter) {
  const list = pool();
  if (!list.length) {
    state.cur = null; state.hinted = false; state.answered = false;
    render();
    return;
  }
  let cand = list.filter(q => q.id !== (state.cur && state.cur.id));
  if (!cand.length) cand = list;
  // 优先出没看过的，避免连续重复
  const fresh = cand.filter(q => !seen.has(q.id));
  const src = fresh.length ? fresh : cand;
  state.cur = src[Math.floor(Math.random() * src.length)];
  state.hinted = false; state.answered = false;
  lastPick.push(state.cur.id);
  if (lastPick.length > 30) lastPick.shift();
  seen.add(state.cur.id);
  write(LS.seen, [...seen]);
  render();
  if (!fromFilter) {
    const card = $('card');
    card.classList.remove('anim'); void card.offsetWidth; card.classList.add('anim');
  }
}

/* ---------------- 渲染主卡片 ---------------- */
function render() {
  const q = state.cur;
  const list = pool();

  // 统计
  const p = pool();
  $('sSeen').textContent = p.filter(x => seen.has(x.id)).length;
  $('sPool').textContent = p.length;
  $('sStar').textContent = starred.size;
  $('sMode').textContent = state.mode === 'star' ? '收藏' : state.mode === 'new' ? '未看过' : '全部';
  $('total').textContent = BANK.length;
  const done = p.length ? p.filter(x => seen.has(x.id)).length / p.length : 0;
  $('bar').style.width = (done * 100).toFixed(1) + '%';

  if (!q) {
    $('meta').innerHTML = '';
    $('qText').textContent = state.mode === 'star' ? '收藏夹还是空的，先刷几道点收藏吧。' : '这个筛选条件下没有题目了。';
    $('hintBox').classList.remove('show');
    $('ansBox').classList.remove('show');
    ['hintBtn','ansBtn','starBtn','nextBtn'].forEach(id => $(id).disabled = true);
    return;
  }
  ['hintBtn','ansBtn','starBtn','nextBtn'].forEach(id => $(id).disabled = false);

  $('meta').innerHTML =
    '<span class="tag cat">' + CATS[q.c] + '</span>' +
    '<span class="tag lv-' + q.lv + '">' + q.lv + '</span>' +
    '<span class="idx">NO.' + String(q.id).padStart(3, '0') + ' / ' + BANK.length + '</span>';
  $('qText').textContent = q.q;
  $('hintText').innerHTML = q.h;
  $('ansText').innerHTML = q.a;
  $('hintBox').classList.toggle('show', state.hinted);
  $('ansBox').classList.toggle('show', state.answered);
  $('hintBtn').textContent = '看提示';
  $('hintBtn').insertAdjacentHTML('beforeend', '<kbd>H</kbd>');
  $('ansBtn').textContent = state.answered ? '收起答案' : '看答案';
  $('ansBtn').insertAdjacentHTML('beforeend', '<kbd>A</kbd>');

  const st = starred.has(q.id);
  $('starBtn').className = st ? 'on' : '';
  $('starBtn').textContent = st ? '已收藏' : '收藏';
  $('starBtn').insertAdjacentHTML('beforeend', '<kbd>S</kbd>');
}

/* ---------------- 动作 ---------------- */
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 1600);
}

$('nextBtn').onclick = () => next();

$('hintBtn').onclick = () => {
  if (!state.cur) return;
  state.hinted = true;
  $('hintBox').classList.add('show');
};

$('ansBtn').onclick = () => {
  if (!state.cur) return;
  state.answered = !state.answered;
  if (state.answered) state.hinted = true;
  $('hintBox').classList.toggle('show', state.hinted);
  $('ansBox').classList.toggle('show', state.answered);
  $('ansBtn').textContent = state.answered ? '收起答案' : '看答案';
  $('ansBtn').insertAdjacentHTML('beforeend', '<kbd>A</kbd>');
};

$('starBtn').onclick = () => {
  if (!state.cur) return;
  const id = state.cur.id;
  if (starred.has(id)) { starred.delete(id); toast('已取消收藏'); }
  else { starred.add(id); toast('已加入收藏'); }
  write(LS.star, [...starred]);
  render();
};

$('themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const nx = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = nx;
  write(LS.theme, nx);
};

$('resetBtn').onclick = () => {
  if (!confirm('将清空"已看过"与"收藏"记录，题库本身不受影响。确定继续？')) return;
  seen.clear(); starred.clear();
  write(LS.seen, []); write(LS.star, []);
  state.mode = 'all';
  document.querySelectorAll('#modeRow .chip').forEach((c, i) => c.classList.toggle('on', i === 0));
  next(true);
  toast('进度已重置');
};

/* ---------------- 键盘操作 ---------------- */
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea') return;
  if (e.code === 'Space' || e.key === 'ArrowRight') { e.preventDefault(); next(); }
  else if (e.key === 'h' || e.key === 'H') $('hintBtn').click();
  else if (e.key === 'a' || e.key === 'A') $('ansBtn').click();
  else if (e.key === 's' || e.key === 'S') $('starBtn').click();
});

/* ---------------- 启动 ---------------- */
(function init() {
  const th = read(LS.theme, 'dark');
  document.documentElement.dataset.theme = th;
  buildChips();
  bindRow('catRow', 'cat');
  bindRow('lvRow', 'lv');
  bindRow('modeRow', 'mode');
  next(true);
})();
</script>
</body>
</html>
