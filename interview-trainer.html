<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>前端面试刷题器</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --panel3:#252a34;
    --border:#2b3140; --text:#e6e9ef; --muted:#8b93a5; --dim:#5d667a;
    --accent:#4f8cff; --accent-soft:rgba(79,140,255,.14);
    --ok:#35c88a; --ok-soft:rgba(53,200,138,.14);
    --warn:#f0b429; --warn-soft:rgba(240,180,41,.13);
    --purple:#8b7cff; --purple-soft:rgba(139,124,255,.14);
    --shadow:0 10px 30px rgba(0,0,0,.35);
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  html[data-theme="light"]{
    --bg:#f4f6fa; --panel:#ffffff; --panel2:#f3f5f9; --panel3:#e9edf4;
    --border:#dde3ec; --text:#1a1f2b; --muted:#5c6678; --dim:#8f98a8;
    --accent:#2f6fe4; --accent-soft:rgba(47,111,228,.10);
    --ok:#12a06a; --ok-soft:rgba(18,160,106,.10);
    --warn:#b07800; --warn-soft:rgba(176,120,0,.10);
    --purple:#6b5bdd; --purple-soft:rgba(107,91,221,.10);
    --shadow:0 8px 24px rgba(23,35,60,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans);
    font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased;
    padding:24px 16px 48px;
  }
  .app{max-width:860px;margin:0 auto}

  /* ---------- 顶栏 ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .brand h1{font-size:19px;margin:0;letter-spacing:.2px}
  .brand .sub{font-size:12.5px;color:var(--dim)}
  .tools{display:flex;gap:8px}

  /* ---------- 统计 ---------- */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px}
  .stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.4px}
  .stat .v{font-size:20px;font-weight:600;font-family:var(--mono);margin-top:2px}
  .stat .v small{font-size:12px;color:var(--dim);font-weight:400;font-family:var(--sans)}

  /* ---------- 筛选 ---------- */
  .filters{margin-bottom:14px;display:flex;flex-direction:column;gap:8px}
  .frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .frow .label{font-size:11.5px;color:var(--dim);width:34px;flex:none;letter-spacing:.5px}
  .chip{
    font-family:var(--sans);font-size:12.5px;color:var(--muted);
    background:transparent;border:1px solid var(--border);border-radius:999px;
    padding:4px 12px;cursor:pointer;transition:all .15s;
  }
  .chip:hover{color:var(--text);border-color:var(--dim)}
  .chip.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .chip .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}

  /* ---------- 主卡片 ---------- */
  .card{
    position:relative;background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:24px 26px 20px;box-shadow:var(--shadow);overflow:hidden;
  }
  .card.anim{animation:slide .28s ease}
  @keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .progress{position:absolute;top:0;left:0;right:0;height:3px;background:var(--panel3)}
  .progress .bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--purple));transition:width .3s}

  .meta{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .tag{font-size:11.5px;padding:2px 9px;border-radius:6px;letter-spacing:.3px;font-weight:500}
  .tag.cat{background:var(--purple-soft);color:var(--purple)}
  .tag.lv-基础{background:var(--ok-soft);color:var(--ok)}
  .tag.lv-高频{background:var(--accent-soft);color:var(--accent)}
  .tag.lv-进阶{background:var(--warn-soft);color:var(--warn)}
  .idx{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}

  .q{font-size:19px;line-height:1.55;margin:0 0 18px;font-weight:600;letter-spacing:.2px}

  .block{border-radius:10px;padding:14px 16px;margin-bottom:12px;font-size:14px;display:none}
  .block.show{display:block;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .block .bt{font-size:11.5px;letter-spacing:.6px;font-weight:600;margin-bottom:8px;text-transform:uppercase}
  .hint{background:var(--warn-soft);border-left:3px solid var(--warn)}
  .hint .bt{color:var(--warn)}
  .answer{background:var(--panel2);border-left:3px solid var(--ok)}
  .answer .bt{color:var(--ok)}
  .answer p{margin:0 0 10px}
  .answer p:last-child{margin-bottom:0}
  .answer ul,.answer ol{margin:6px 0 10px;padding-left:20px}
  .answer li{margin-bottom:4px}
  .answer b,.answer strong{color:var(--text);font-weight:600}
  .answer code{
    font-family:var(--mono);font-size:12.5px;background:var(--panel3);
    padding:1.5px 6px;border-radius:5px;color:var(--accent);
  }
  .answer pre{
    background:var(--panel3);border:1px solid var(--border);border-radius:9px;
    padding:12px 14px;overflow-x:auto;margin:10px 0;
  }
  .answer pre code{background:none;padding:0;color:var(--text);font-size:12.5px;line-height:1.7;display:block;white-space:pre}

  /* ---------- 考点标签 ---------- */
  .tag.clickable{cursor:pointer;transition:filter .15s}
  .tag.clickable:hover{filter:brightness(1.3)}
  .tag.clickable.on{outline:1px solid currentColor}

  /* ---------- 面试官追问 ---------- */
  .follow{background:var(--purple-soft);border-left:3px solid var(--purple)}
  .follow .bt{color:var(--purple);display:flex;align-items:center;justify-content:space-between;gap:10px}
  .fuAll{font-size:11.5px;color:var(--purple);cursor:pointer;opacity:.85;font-weight:500;letter-spacing:0;text-transform:none;white-space:nowrap}
  .fuAll:hover{opacity:1;text-decoration:underline}
  .fu{border-top:1px dashed var(--border);padding:10px 0}
  .fu:first-child{border-top:0;padding-top:2px}
  .fq{display:flex;gap:9px;cursor:pointer;align-items:flex-start;font-weight:600;font-size:13.5px;line-height:1.6}
  .fq:hover{color:var(--purple)}
  .fno{flex:none;font-family:var(--mono);font-size:11px;color:var(--purple);background:rgba(139,124,255,.18);border-radius:5px;padding:2px 6px;margin-top:1px}
  .fa{display:none;margin:8px 0 2px 31px;color:var(--muted);font-size:13.5px;line-height:1.7}
  .fu.open .fa{display:block;animation:fade .2s ease}
  .fu.open .fq{color:var(--purple)}
  .fa code{font-family:var(--mono);font-size:12.5px;background:var(--panel3);padding:1.5px 6px;border-radius:5px;color:var(--accent)}

  /* ---------- 按钮 ---------- */
  .actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px;padding-top:16px;border-top:1px solid var(--border)}
  button{font-family:var(--sans);font-size:13.5px;border-radius:9px;cursor:pointer;transition:all .15s;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:9px 15px}
  button:hover{border-color:var(--dim);background:var(--panel3)}
  button:active{transform:translateY(1px)}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
  button.primary:hover{background:#3f7ceb;border-color:#3f7ceb}
  button.next{margin-left:auto;background:var(--purple-soft);border-color:var(--purple);color:var(--purple);font-weight:500}
  button.next:hover{background:var(--purple);color:#fff}
  button.on{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  kbd{
    font-family:var(--mono);font-size:10.5px;background:rgba(128,140,160,.18);
    border:1px solid var(--border);border-radius:4px;padding:1px 5px;margin-left:6px;color:inherit;opacity:.85;
  }
  button.ghost{padding:7px 11px;font-size:13px}

  footer{margin-top:16px;text-align:center;font-size:12px;color:var(--dim)}
  footer b{color:var(--muted);font-family:var(--mono)}
  .toast{
    position:fixed;left:50%;bottom:32px;transform:translateX(-50%) translateY(20px);
    background:var(--panel3);border:1px solid var(--border);color:var(--text);
    padding:9px 18px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;
    transition:all .25s;box-shadow:var(--shadow);z-index:99;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--muted);padding:30px 0;font-size:14px}
  @media(max-width:640px){
    .stats{grid-template-columns:1fr 1fr}
    .card{padding:20px 17px 16px}
    .q{font-size:17px}
    button.next{margin-left:0;width:100%}
    .frow .label{width:100%}
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>前端面试刷题器</h1>
      <span class="sub">点击换题 · 先自己想 · 再看提示和答案</span>
    </div>
    <div class="tools">
      <button class="ghost" id="resetBtn" title="清空本地答题与收藏记录">重置进度</button>
      <button class="ghost" id="themeBtn" title="切换深浅色">切换主题</button>
    </div>
  </header>

  <section class="stats">
    <div class="stat"><div class="k">当前题库进度</div><div class="v"><span id="sSeen">0</span><small> / <span id="sPool">0</span> 题</small></div></div>
    <div class="stat"><div class="k">已收藏</div><div class="v"><span id="sStar">0</span><small> 题</small></div></div>
    <div class="stat"><div class="k">上次只看</div><div class="v"><span id="sMode">全部</span></div></div>
  </section>

  <section class="filters">
    <div class="frow"><span class="label">分类</span><div class="frow" id="catRow" style="gap:6px"></div></div>
    <div class="frow"><span class="label">难度</span><div class="frow" id="lvRow" style="gap:6px"></div></div>
    <div class="frow"><span class="label">范围</span><div class="frow" id="modeRow" style="gap:6px"></div></div>
    <div class="frow" id="tagRow" style="display:none"><span class="label">标签</span><div class="frow" id="tagChips" style="gap:6px"></div></div>
  </section>

  <main class="card" id="card">
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div class="meta" id="meta"></div>
    <h2 class="q" id="qText">加载中…</h2>
    <div class="block hint" id="hintBox"><div class="bt">提示</div><div id="hintText"></div></div>
    <div class="block answer" id="ansBox"><div class="bt">参考答案</div><div id="ansText"></div></div>
    <div class="block follow" id="fuBox"><div class="bt">面试官追问<span class="fuAll" id="fuAll">展开全部</span></div><div id="fuText"></div></div>
    <div class="actions">
      <button id="hintBtn">看提示<kbd>H</kbd></button>
      <button id="ansBtn" class="primary">看答案<kbd>A</kbd></button>
      <button id="starBtn">收藏<kbd>S</kbd></button>
      <button id="nextBtn" class="next">换一题<kbd>空格</kbd></button>
    </div>
  </main>

  <footer>题库共 <b id="total">0</b> 题 · 含 <b id="fuTotal">0</b> 条面试官追问 · 全部离线内置 · 进度与收藏保存在本机浏览器<br>
  快捷键：空格 换题 · H 提示 · A 答案 · S 收藏 · F 展开追问</footer>
</div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   题库数据
   每条题目结构：
     { c: 分类key, lv: 难度, q: 题干, h: 提示, a: 参考答案(HTML),
       tags: [考点标签...], fu: [{ q: 面试官追问, a: 要点(HTML) }, ...] }
   想加题就往数组里追加一个对象即可，参考最上面几条的写法。
   不用自己反复核对字段 —— 直接跑 node scripts/check-bank.js，
   哪一题漏了或写错了，它会逐条报出来。

   两条硬性约束（改完题库务必跑一次校验脚本）：
     1. 题干 q 必须全局唯一 —— 它是收藏与进度的稳定键（见下方 keyOf）
     2. a 与 fu 的反引号内不能出现裸反引号，行内代码一律用 <code> 标签

   校验命令：node scripts/check-bank.js
   ============================================================ */
const BANK = [
/* ---------- JS 基础 ---------- */
{c:'js', lv:'基础', q:'什么是闭包？它有哪些典型应用场景？会造成内存泄漏吗？',
 h:'从"函数 + 词法作用域"这个角度切入，重点在于内部函数引用了外部函数的变量。',
 a:`<p><b>定义：</b>闭包 = 函数 + 声明该函数时的词法环境。当一个内部函数引用了外部函数的变量，且该内部函数在外部函数执行返回后仍被引用，就形成了闭包。</p>
<pre><code>function counter() {
  let n = 0;            // 被闭包"记住"的变量
  return () =&gt; ++n;
}
const c = counter();
c(); // 1
c(); // 2</code></pre>
<p><b>典型场景：</b></p>
<ul><li>封装私有变量（如上例的 n 无法被外部直接修改）</li>
<li>防抖 / 节流中的定时器 id 需要在多次调用间保持</li>
<li>函数柯里化、偏函数</li>
<li>模块化早期方案（IIFE 模拟私有作用域）</li>
<li>循环中保存每次迭代的值（let 或 IIFE）</li></ul>
<p><b>内存问题：</b>闭包本身不是泄漏。被闭包引用的变量因为一直可达，无法被垃圾回收，所以会常驻内存。真正的问题是在闭包里长期持有 DOM 节点、大数组这类对象却不再释放。处理办法是把引用置为 null，或在组件卸载时移除事件监听。</p>`,
 tags:['闭包','作用域','内存'],
 fu:[{q:`追问：循环里用 var 绑定事件，为什么最后输出的都是同一个值？怎么修？`, a:`因为 var 是函数作用域，三次迭代共用同一个变量，回调真正执行时读到的已是最终值。修法两种：把 var 换成 let（每次迭代生成新的词法绑定），或者用 IIFE 把当次的值当参数传进去锁住。`},
   {q:`追问：闭包里的变量为什么不会被回收？这是内存泄漏吗？`, a:`要区分"常驻"和"泄漏"。被闭包引用的变量始终可达，GC 不会回收，这是设计意图，不是泄漏。真正的泄漏是任务已经结束却仍被意外持有——比如组件卸载了但事件监听没解绑、定时器没清、把 DOM 节点挂在了闭包变量上。答这类题先给定义，再说"是否泄漏取决于生命周期是否结束"。`},
   {q:`追问：框架里的闭包陷阱，举个例子？`, a:`React 函数组件每次渲染都重新执行，渲染时捕获的 props/state 形成一层新的闭包。useCallback / useMemo 的依赖数组写漏了，就会把旧闭包缓存下来，导致回调里读到的还是上一次的值。这是闭包在框架里最常见的表现形式。`}]},


{c:'js', lv:'基础', q:'var、let、const 三者有什么区别？',
 h:'从作用域、变量提升、重复声明、是否可修改这四个维度对比。',
 a:`<ul>
<li><b>作用域：</b>var 是函数作用域；let / const 是块级作用域（一对 {} 就是一个块）。</li>
<li><b>变量提升：</b>var 会提升并初始化为 undefined，声明前访问得到 undefined；let / const 也提升但存在"暂时性死区（TDZ）"，声明前访问直接抛 ReferenceError。</li>
<li><b>重复声明：</b>var 允许重复声明覆盖；let / const 在同一作用域内重复声明报错。</li>
<li><b>全局对象：</b>全局 var 会挂到 window 上，let / const 不会。</li>
<li><b>可修改性：</b>const 要求声明时必须初始化，且不允许重新赋值——但对象内部属性仍可修改，它约束的是"绑定不可变"，不是"值不可变"。</li>
</ul>
<pre><code>const obj = { a: 1 };
obj.a = 2;      // 可以
obj = {};       // TypeError</code></pre>
<p><b>实践建议：</b>默认用 const，需要重新赋值时用 let，var 基本不再使用。</p>`,
 tags:['作用域','TDZ','ES6'],
 fu:[{q:`追问：什么叫暂时性死区（TDZ）？声明前访问会怎样？`, a:`let / const 的变量从进入块到声明语句之间处于 TDZ，访问会抛 ReferenceError，而不是得到 undefined。注意 typeof 同样会抛错，这是它和 var 最实际的差别。`},
   {q:`追问：const 声明的对象属性能改吗？怎么做才真正不可变？`, a:`能改——const 约束的是绑定，不是值。要冻结用 Object.freeze（但这是浅冻结，嵌套对象仍可改）；深层次不可变要么递归冻结，要么从设计上就返回新对象。`},
   {q:`追问：for 循环里的 let 是怎么做到每次迭代都是新变量的？`, a:`规范上，for 语句每次迭代会创建一个新的词法环境，并复制上一轮的值。所以闭包捕获的是各自那一份，不会互相干扰。这正是 let 相比 var 的关键差异，也是经典考题。`}]},


{c:'js', lv:'基础', q:'什么是原型和原型链？instanceof 的判断依据是什么？',
 h:'函数有 prototype 属性，对象有 __proto__（或 [[Prototype]]）属性，两者指向同一个原型对象。',
 a:`<p>每个函数创建时会同时生成一个 prototype 属性，指向一个对象，这个对象就是由该函数 new 出来的实例的原型。每个对象内部有一个隐式属性 [[Prototype]]（浏览器里可通过 Object.getPrototypeOf 或 __proto__ 访问），指向它的原型对象。</p>
<pre><code>function Person(name){ this.name = name; }
Person.prototype.say = function(){ return this.name; };

const p = new Person('Tom');
p.__proto__ === Person.prototype;              // true
Person.prototype.__proto__ === Object.prototype; // true
Object.prototype.__proto__ === null;             // 原型链终点</code></pre>
<p>当访问 p.say 时，引擎先在 p 自身找，找不到就沿着 __proto__ 逐级向上，直到 Object.prototype，最后是 null。这条查找路径就是<b>原型链</b>。</p>
<p><b>instanceof 的判断依据：</b>沿左侧对象的原型链向上查找，看是否能找到右侧构造函数的 prototype。</p>
<pre><code>p instanceof Person; // 等价于原型链上存在 Person.prototype</code></pre>
<p><b>应用：</b>原型方法被所有实例共享，节省内存；这也是原型继承的基础。</p>`,
 tags:['原型链','继承','instanceof'],
 fu:[{q:`追问：instanceof 的判断过程是什么？手写要注意什么？`, a:`沿左侧对象的原型链逐层查找，看是否等于右侧的 prototype，命中返回 true，走到 null 返回 false。注意右侧必须是函数（否则抛 TypeError）；另外跨 iframe 的对象因为处于不同 Realm，instanceof 会失效，这时要用 Array.isArray 或 Object.prototype.toString.call。`},
   {q:`追问：构造函数里 return 一个对象会怎样？`, a:`如果构造函数显式 return 一个对象，new 的结果就是那个对象，原本的 this 被丢弃；如果 return 的是原始值（或没写 return），则忽略它，仍返回新创建的实例。`},
   {q:`追问：class 的继承和 ES5 手写继承，本质差别在哪？`, a:`class 的方法不可枚举、必须用 new 调用；更关键的是 extends 会把子类构造函数的原型指向父类构造函数，所以静态方法可以被继承——这是 ES5 手写继承最容易漏的一环。super 能工作也依赖这条原型关系。`}]},


{c:'js', lv:'高频', q:'this 的指向规则是怎样的？箭头函数的 this 有什么不同？',
 h:'按调用方式分五类记忆：默认、隐式、显式、new、箭头函数。',
 a:`<p><b>结论：this 的指向在函数被调用时确定，取决于调用方式，而不是定义位置。</b></p>
<ol>
<li><b>默认绑定：</b>直接调用 fn()，非严格模式下 this 是 window，严格模式是 undefined。</li>
<li><b>隐式绑定：</b>作为对象方法调用 obj.fn()，this 指向 obj。注意赋值会丢失绑定：<code>const f = obj.fn; f()</code> 中 this 变成 window。</li>
<li><b>显式绑定：</b>通过 call / apply / bind 指定 this。</li>
<li><b>new 绑定：</b>new Fn() 时 this 指向新创建的对象。优先级：new &gt; 显式 &gt; 隐式 &gt; 默认。</li>
<li><b>箭头函数：</b>没有自己的 this，继承定义时所在外层作用域的 this，且无法用 call / apply / bind 改变。同时它也没有 arguments、不能作为构造函数。</li>
</ol>
<p><b>易错点：</b>绑定丢失。setTimeout(obj.method, 100) 会丢失 this，因为传进去的是函数本身而不是调用表达式。解决办法是 bind(obj) 或改用箭头函数。</p>`,
 tags:['this','绑定规则','箭头函数'],
 fu:[{q:`追问：this 的绑定优先级从高到低是什么？`, a:`new 绑定 > 显式绑定（call/apply/bind）> 隐式绑定（obj.fn()）> 默认绑定（非严格模式指向全局对象，严格模式为 undefined）。箭头函数不参与这套规则，它取外层词法作用域的 this。`},
   {q:`追问：为什么把对象方法赋值给变量再调用，this 就变了？`, a:`this 取决于调用时的形态，不是定义位置。obj.fn() 是隐式绑定，this 是 obj；const f = obj.fn; f() 变成默认绑定，this 丢失。常见解法是 bind 或改用箭头函数。`},
   {q:`追问：React 类组件里事件处理函数为什么常要 bind(this)？`, a:`因为 onClick={this.handle} 相当于把函数摘下来再调用，隐式绑定丢失，类内部默认严格模式所以 this 是 undefined。现在的写法更推荐类字段箭头函数，或者直接用函数组件。`}]},


{c:'js', lv:'高频', q:'什么是事件循环？宏任务和微任务的区别是什么？',
 h:'关键在于：每执行完一个宏任务，都要清空当前所有微任务，然后才可能渲染。',
 a:`<p><b>执行顺序：</b>同步代码 → 清空微任务队列 → 渲染（如需要）→ 取下一个宏任务 → 再清空微任务……如此循环。</p>
<ul>
<li><b>宏任务（macrotask）：</b>script 整体代码、setTimeout、setInterval、setImmediate、I/O、UI 事件回调。</li>
<li><b>微任务（microtask）：</b>Promise.then / catch / finally、queueMicrotask、MutationObserver。</li>
</ul>
<pre><code>console.log('1');
setTimeout(() =&gt; console.log('2'));
Promise.resolve().then(() =&gt; console.log('3'));
console.log('4');
// 输出：1 4 3 2</code></pre>
<p><b>为什么微任务优先级高：</b>微任务队列在每次宏任务结束后被完整清空，只有队列空了才会进入下一轮事件循环。所以微任务里再产生微任务，也会在本轮全部执行完。</p>
<p><b>实践影响：</b>微任务中长时间循环会阻塞渲染（页面卡死）；setTimeout 嵌套超过 4 层时最小延迟被限制为 4ms。</p>`,
 tags:['事件循环','微任务','宏任务'],
 fu:[{q:`追问：哪些算宏任务，哪些算微任务？`, a:`宏任务：整段 script、setTimeout / setInterval、setImmediate（Node）、I/O、UI 渲染。微任务：Promise 的 then / catch / finally、queueMicrotask、MutationObserver、Node 的 process.nextTick（优先级更高）。`},
   {q:`追问：微任务会不会饿死渲染？为什么？`, a:`会。每执行完一个宏任务，就会把微任务队列彻底清空（清空过程中新产生的微任务继续排队执行），全部清完才轮到渲染和下一个宏任务。所以不断排微任务会让页面直接卡死。`},
   {q:`追问：await 后面的代码，相对同步代码是什么执行顺序？`, a:`await 之后的代码等价于放进 .then 里，属于微任务。它会先让出执行权，把当前同步代码跑完，再按微任务顺序恢复执行。`}]},


{c:'js', lv:'高频', q:'深拷贝和浅拷贝的区别？如何实现一个深拷贝？',
 h:'区别在于"嵌套的引用类型"是否被复制。深拷贝要处理循环引用和特殊对象。',
 a:`<p><b>浅拷贝：</b>只复制第一层，嵌套对象仍然是同一个引用。常见方式：Object.assign、展开运算符、数组 slice / concat。</p>
<p><b>深拷贝：</b>递归复制所有层级，新对象与原对象完全独立。</p>
<pre><code>function deepClone(obj, map = new WeakMap()) {
  if (obj === null || typeof obj !== 'object') return obj;
  if (map.has(obj)) return map.get(obj);   // 处理循环引用
  if (obj instanceof Date) return new Date(obj);
  if (obj instanceof RegExp) return new RegExp(obj);
  const target = Array.isArray(obj) ? [] : {};
  map.set(obj, target);
  for (const k of Reflect.ownKeys(obj)) {  // 含 Symbol 键
    target[k] = deepClone(obj[k], map);
  }
  return target;
}</code></pre>
<p><b>现成方案与局限：</b>JSON.parse(JSON.stringify(obj)) 最省事，但会丢失 undefined、函数、Symbol，把 Date 变成字符串，无法处理循环引用和 Map / Set。structuredClone 是浏览器内置的深拷贝，支持循环引用和 Date，但不支持函数。</p>`,
 tags:['深拷贝','引用类型','递归'],
 fu:[{q:`追问：JSON.parse(JSON.stringify()) 有哪些坑？`, a:`会丢 undefined、函数、Symbol；Date 变成字符串；RegExp / Map / Set 变成空对象；NaN 和 Infinity 变成 null；遇到循环引用直接抛错。只适合纯 JSON 数据。`},
   {q:`追问：循环引用怎么处理？`, a:`用一个 WeakMap 记录"原对象到副本"的映射，递归前先查表，命中就直接返回已有副本。这同时也解决了同一对象被多处引用时的引用一致性问题。`},
   {q:`追问：structuredClone 出来了，还用手写吗？`, a:`structuredClone 是内置 API，支持 Date、Map、Set、ArrayBuffer、循环引用，但不支持函数、DOM 节点和自定义类的原型。日常数据直接用它；需要保留类实例或函数时才手写。`}]},


{c:'js', lv:'高频', q:'防抖（debounce）和节流（throttle）的区别是什么？分别怎么实现？',
 h:'防抖是"等你停手再执行"，节流是"固定频率执行"。想一想搜索框输入和滚动监听分别该用哪个。',
 a:`<p><b>防抖：</b>事件触发后延迟 n 毫秒执行，若期间再次触发则重新计时。适合搜索联想、表单校验、窗口 resize。</p>
<pre><code>function debounce(fn, delay = 300) {
  let timer = null;
  return function (...args) {
    clearTimeout(timer);
    timer = setTimeout(() =&gt; fn.apply(this, args), delay);
  };
}</code></pre>
<p><b>节流：</b>单位时间内只执行一次。适合滚动监听、鼠标移动、按钮防重复点击。</p>
<pre><code>// 时间戳版：立即执行，最后一次可能不执行
function throttle(fn, wait = 200) {
  let last = 0;
  return function (...args) {
    const now = Date.now();
    if (now - last &gt;= wait) {
      last = now;
      fn.apply(this, args);
    }
  };
}</code></pre>
<p><b>一句话区分：</b>防抖保证"最后一次"，节流保证"均匀分布"。搜索框需要等用户输完再发请求，用防抖；页面滚动时需要持续获取位置但不能太频繁，用节流。</p>`,
 tags:['防抖','节流','闭包'],
 fu:[{q:`追问：为什么实现里还要提供立即执行和取消能力？`, a:`搜索框希望在第一次输入时就响应，所以要 leading；组件卸载或切换数据源时要取消挂起的定时器，否则可能触发已失效的回调，所以要 cancel。面试实现题主动提这两点会明显加分。`},
   {q:`追问：this 和参数怎么正确透传？`, a:`返回包装函数时用普通函数，内部通过 fn.apply(this, args) 转发，这样调用者绑定的 this 和实参都不会丢。如果用箭头函数包裹，this 会被固定在外层，参数仍要靠剩余参数转发。`},
   {q:`追问：工作中你会自己写吗？`, a:`很少——lodash 的 debounce / throttle 已经处理了 leading、trailing、cancel、flush 这些边界。但面试考的是原理：闭包保存定时器 id、每次调用清掉旧的、转发 this 与参数。`}]},


{c:'js', lv:'基础', q:'Promise 有哪几种状态？then 的返回值有什么规则？',
 h:'三个状态、两个终态不可逆；then 返回的一定是一个新 Promise。',
 a:`<p><b>三种状态：</b>pending（进行中）、fulfilled（成功）、rejected（失败）。状态只能从 pending 转到 fulfilled 或 rejected，一旦确定不可更改。</p>
<pre><code>const p = new Promise((resolve, reject) =&gt; {
  setTimeout(() =&gt; resolve('ok'), 1000);
});
p.then(v =&gt; console.log(v))       // ok
 .catch(e =&gt; console.log(e))
 .finally(() =&gt; console.log('done'));</code></pre>
<p><b>then 返回规则：</b>then 总是返回一个新的 Promise，其状态由回调的返回值决定。</p>
<ul>
<li>返回普通值 → 新 Promise 变成 fulfilled，值为该值</li>
<li>返回 Promise → 等它 settle，新 Promise 跟随其状态</li>
<li>抛出错误 → 新 Promise 变成 rejected</li>
</ul>
<p><b>常用静态方法：</b>Promise.all（全部成功才成功，一个失败就失败）、Promise.allSettled（等全部结束，返回每个结果）、Promise.race（第一个 settle 的决定结果）、Promise.any（第一个成功的决定结果）。</p>`,
 tags:['Promise','链式调用','错误处理'],
 fu:[{q:`追问：then 里返回一个 Promise 会怎样？`, a:`会被解包：下一个 then 要等这个 Promise settled 之后才执行，并且拿到它的值。链式调用能串起来就是靠这个机制。`},
   {q:`追问：then 里 throw 或者返回 rejected 的 Promise 会怎样？`, a:`状态会沿链向下穿透，直到遇到写了第二个参数或 catch 的位置被处理。中间那些没写失败回调的 then 会被直接跳过。`},
   {q:`追问：Promise 里的错误能用外层 try/catch 包住吗？`, a:`包不住异步 reject。同步抛出的错误会被 Promise 构造函数捕获并转成 rejected 状态；但异步阶段抛出的不会。要么链式 .catch，要么在 async 函数里 await 之后用 try/catch。`}]},


{c:'js', lv:'进阶', q:'async / await 的本质是什么？它和 Promise 是什么关系？',
 h:'async 函数的返回值一定是 Promise；await 相当于 .then 的语法糖，但错误处理方式不同。',
 a:`<p><b>本质：</b>async / await 是 Promise 的语法糖，是 Generator + 自动执行器的语法封装，让异步代码看起来像同步代码。</p>
<ul>
<li>async 函数总是返回 Promise。返回普通值会被 Promise.resolve 包装；抛出的错误会让返回的 Promise 变成 rejected。</li>
<li>await 后面接的是一个 thenable，它会暂停当前 async 函数的执行，等结果出来再继续。这个"暂停"不会阻塞主线程，只是把后续代码注册成微任务。</li>
</ul>
<pre><code>async function get() {
  try {
    const res = await fetch('/api');
    const data = await res.json();
    return data;
  } catch (e) {
    console.error('统一捕获同步错误和 rejected', e);
  }
}</code></pre>
<p><b>与 then 的差异：</b>await 可以用 try / catch 捕获同步和异步错误，写法更接近同步；但要注意在循环中顺序 await 会串行执行，需要并发时应写成 <code>await Promise.all(list.map(...))</code>。</p>`,
 tags:['async','await','并发控制'],
 fu:[{q:`追问：await 后面跟一个普通值会怎样？`, a:`会被 Promise.resolve 包一层，但仍然会让出一次微任务。所以 await 1 之后的代码依然是异步执行的，顺序排在同步代码之后。`},
   {q:`追问：async 函数里的错误不 catch 会去哪？`, a:`变成返回 Promise 的 rejected 状态，需要调用方处理，否则会触发 unhandledrejection。await 一个 rejected 的 Promise，等价于在那一行 throw。`},
   {q:`追问：多个互不依赖的请求，串行 await 有什么问题？`, a:`总耗时等于所有请求之和，白白串行等待。应该先用 Promise.all 并发发起再统一 await，总耗时等于最慢的那个。这个追问在性能相关面试里出现频率很高。`}]},


{c:'js', lv:'基础', q:'== 和 === 有什么区别？null 和 undefined 用哪个判断？',
 h:'=== 不做类型转换。== 有一条容易记错的类型转换规则表。',
 a:`<p><b>===（严格相等）：</b>类型不同直接返回 false，不做转换。</p>
<p><b>==（宽松相等）：</b>会先做类型转换再比较。核心规则：</p>
<ul>
<li>null == undefined 为 true，且它们 == 其他任何值都是 false</li>
<li>数字与字符串比较：字符串转数字</li>
<li>布尔值参与比较：转成数字（true→1，false→0）</li>
<li>对象与基本类型比较：对象调用 valueOf / toString 转成基本类型</li>
</ul>
<pre><code>1 == '1'        // true
0 == false      // true
null == undefined // true
null == 0       // false
[] == false     // true（[] 转成 ''，再转成 0）
NaN == NaN      // false</code></pre>
<p><b>实践建议：</b>一律用 ===。判断"值为空"时明确写 <code>v === null || v === undefined</code>，或用 <code>v == null</code> 这一个精确覆盖两者的写法。</p>`,
 tags:['隐式转换','相等判断','类型'],
 fu:[{q:`追问：[] == false 为什么是 true？`, a:`两边都转成数字比较：[] 经 ToPrimitive 得到空字符串，再转数字是 0；false 转数字也是 0，所以相等。这类题要答"按规范先转成同一类型再比"，而不是"JS 乱来"。`},
   {q:`追问：什么情况下用 == 反而是好实践？`, a:`基本只有一种：x == null 可以同时判掉 null 和 undefined，比写 x === null || x === undefined 简洁。其他场景统一用 ===。`},
   {q:`追问：Object.is 和 === 有什么区别？`, a:`只有两处不同：Object.is(NaN, NaN) 为 true，而 NaN === NaN 为 false；Object.is(0, -0) 为 false，而 0 === -0 为 true。React 判断状态是否变化用的就是这套语义。`}]},


{c:'js', lv:'基础', q:'JS 中判断数据类型有哪些方式？各自的局限是什么？',
 h:'typeof、instanceof、constructor、Object.prototype.toString，逐个说适用边界。',
 a:`<ul>
<li><b>typeof：</b>适合判断基本类型，但 typeof null 返回 'object'（历史遗留），无法区分数组、普通对象、Date。</li>
<li><b>instanceof：</b>基于原型链，适合判断引用类型和自定义类，但跨 iframe / 跨 Realm 时失效（不同窗口的 Array 构造函数不同）。</li>
<li><b>constructor：</b>可被修改，不可靠。</li>
<li><b>Object.prototype.toString.call(x)：</b>最通用，返回 '[object Array]' 这类字符串，能准确区分所有内置类型。</li>
<li><b>Array.isArray(x)：</b>判断数组的首选，能正确处理跨 Realm 场景。</li>
</ul>
<pre><code>Object.prototype.toString.call([])      // '[object Array]'
Object.prototype.toString.call(null)    // '[object Null]'
Number.isNaN(NaN);  Number.isFinite(1);  // 判断数字更严格，不做类型转换</code></pre>`,
 tags:['typeof','instanceof','类型判断'],
 fu:[{q:`追问：typeof null 为什么是 object？`, a:`早期 JS 用值的低位标记表示类型，null 的机器表示是全 0，被误判成了对象。这是历史遗留问题，为了兼容性一直保留至今。`},
   {q:`追问：怎么准确判断数组和普通对象？`, a:`数组用 Array.isArray，它能识别跨 iframe 的数组；通用判断用 Object.prototype.toString.call(x)，会返回 [object Array] 这类标签。typeof 对数组和 null 都不可靠。`},
   {q:`追问：typeof 一个没声明的变量会怎样？`, a:`返回 undefined 且不报错，这是 typeof 的安全特例。但如果变量处于 TDZ 中（let 已进入作用域但尚未初始化），typeof 会抛 ReferenceError。`}]},


{c:'js', lv:'基础', q:'map、forEach、filter、reduce 有什么区别？',
 h:'是否返回新数组、能否中断、返回值是什么，这三点就能理清。',
 a:`<ul>
<li><b>forEach：</b>只遍历，返回 undefined，无法中途 break（throw 除外）。</li>
<li><b>map：</b>遍历并返回等长的新数组，长度与原数组一致。</li>
<li><b>filter：</b>返回过滤后的新数组，长度可能变短。</li>
<li><b>reduce：</b>把数组归约成一个值，可以是数字、对象、数组，灵活度最高。</li>
</ul>
<pre><code>const arr = [1, 2, 3, 4];
arr.map(n =&gt; n * 2);                  // [2, 4, 6, 8]
arr.filter(n =&gt; n % 2 === 0);         // [2, 4]
arr.reduce((sum, n) =&gt; sum + n, 0);   // 10
// 用 reduce 统计词频
['a','b','a'].reduce((m, w) =&gt; (m[w] = (m[w] || 0) + 1, m), {}); // {a:2, b:1}</code></pre>
<p><b>注意：</b>这些都是浅遍历，遇到嵌套数组需要自己递归或用 flatMap。另外它们都不会修改原数组，但回调里手动改动元素属性仍会影响原对象。</p>`,
 tags:['数组方法','reduce','遍历'],
 fu:[{q:`追问：map 和 forEach 最大的差别是什么？`, a:`map 返回等长的新数组，语义是"转换"；forEach 返回 undefined，语义是"遍历并产生副作用"。想拿结果却用 forEach 里 push，是常见写法问题，代码评审时经常被指出。`},
   {q:`追问：reduce 的初始值要不要给？`, a:`强烈建议给。不给时第一次回调的累加器是数组首元素，空数组会直接抛 TypeError；给了初始值语义更清晰，也统一了空数组的处理。`},
   {q:`追问：这些方法能中途 break 吗？`, a:`不能。forEach / map 无法中断，只能靠抛异常或改用 for...of、some、find 这类能提前返回的方法。比如"找到第一个满足条件的就停"应该用 some 或 find。`}]},


{c:'js', lv:'进阶', q:'JS 的垃圾回收机制是怎样的？什么是内存泄漏？',
 h:'核心是"可达性"：从根对象出发能否被引用到。',
 a:`<p><b>机制：</b>现代浏览器用<b>标记清除</b>为主。垃圾回收器从根（window、全局变量、活动函数调用栈）出发，标记所有可达对象，未标记的即视为垃圾回收。引用计数是老方案，因为无法处理循环引用已被淘汰。</p>
<p><b>常见内存泄漏场景：</b></p>
<ul>
<li>意外的全局变量（未声明的赋值）</li>
<li>被遗忘的定时器 / setInterval 未 clear</li>
<li>未移除的事件监听，尤其绑定在 window、document 上的</li>
<li>闭包中长期持有大对象或 DOM 引用</li>
<li>脱离 DOM 树但被 JS 变量引用的节点（detached DOM）</li>
<li>缓存无限增长且没有淘汰策略</li>
</ul>
<p><b>排查手段：</b>Chrome DevTools 的 Memory 面板，用 Heap Snapshot 做前后对比，或 Performance 面板观察内存曲线是否持续上升。</p>`,
 tags:['垃圾回收','内存泄漏','可达性'],
 fu:[{q:`追问：什么叫可达性？`, a:`从根（全局对象、当前执行栈中的变量、闭包环境等）出发，沿引用链能访问到的对象就是可达的，可达即不回收。V8 用的是标记清除一类的算法，判断依据是可达性而不是引用计数。`},
   {q:`追问：平时最容易写出哪几种内存泄漏？`, a:`未解绑的事件监听（尤其是挂在 window / document 上的）、忘记清理的定时器与订阅、被全局缓存或闭包长期持有的大对象、以及 detached DOM——节点已从文档移除但 JS 仍持有引用。`},
   {q:`追问：怎么排查线上内存泄漏？`, a:`Chrome DevTools 的 Memory 面板：用 Heap snapshot 前后各采一次做对比，看哪些对象数量持续增长且不被释放；或看 Performance 面板的内存曲线，正常应呈锯齿状回落，若持续抬升就有泄漏。`}]},


{c:'js', lv:'进阶', q:'为什么 0.1 + 0.2 !== 0.3？实际开发中怎么处理小数运算？',
 h:'和 IEEE 754 双精度浮点数的二进制表示有关。',
 a:`<p><b>原因：</b>JS 的 Number 遵循 IEEE 754 双精度 64 位浮点标准，用二进制表示小数。0.1 和 0.2 在二进制里都是无限循环小数，只能截断存储，因此存在精度损失。相加后得到 0.30000000000000004，与字面量 0.3 的存储值不相等。</p>
<pre><code>0.1 + 0.2                    // 0.30000000000000004
0.1 + 0.2 === 0.3            // false
Math.abs(0.1 + 0.2 - 0.3) &lt; Number.EPSILON  // true，用误差容忍比较</code></pre>
<p><b>处理方案：</b></p>
<ul>
<li>金额用"分"为单位转成整数运算，展示时再除以 100（最稳妥）</li>
<li>用 toFixed 或 toPrecision 四舍五入，注意 toFixed 自身也有舍入误差（1.005.toFixed(2) 得到 '1.00'）</li>
<li>引入 decimal.js、big.js 这类高精度库</li>
</ul>
<p><b>顺带：</b>安全整数范围是 Number.MAX_SAFE_INTEGER（2^53 - 1）。超出场景用 BigInt。</p>`,
 tags:['浮点数','精度'],
 fu:[{q:`追问：为什么 0.1 存不下来？`, a:`IEEE 754 双精度用二进制分数表示小数，0.1 是无限循环二进制小数，只能截断存储，于是产生舍入误差。整数在安全范围（正负 2 的 53 次方以内）是精确的。`},
   {q:`追问：金额计算应该怎么做？`, a:`统一转成整数（以分为单位）参与运算，最后再转回；或引入 decimal.js / big.js 这类库。不要拿 toFixed 的结果当计算值用，它只是四舍五入后的展示形式。`},
   {q:`追问：Number.EPSILON 怎么用？`, a:`用于浮点数的近似相等判断：Math.abs(a - b) < Number.EPSILON。注意它只适合量级接近 1 的数，大数之间的比较要按相对误差处理。`}]},


{c:'js', lv:'基础', q:'什么是变量提升？作用域链是怎么查找变量的？',
 h:'分清楚"声明提升"和"初始化"两件事，函数声明和函数表达式的差别也要说。',
 a:`<p><b>变量提升：</b>JS 引擎在执行前会先扫描当前作用域的声明。var 声明被提升并初始化为 undefined；函数声明整体被提升，所以可以在定义之前调用。</p>
<pre><code>console.log(a);   // undefined
var a = 1;

foo();            // 可以执行
function foo(){}

bar();            // TypeError: bar is not a function
var bar = function(){};</code></pre>
<p><b>let / const：</b>声明也会提升，但进入"暂时性死区"，在声明语句执行前访问会抛 ReferenceError。</p>
<p><b>作用域链：</b>函数在定义时就确定了外层作用域，形成一条链。查找变量时从当前作用域开始逐级向外，直到全局作用域，都找不到则报 ReferenceError。注意是<b>词法作用域</b>——由定义位置决定，而不是调用位置。</p>`,
 tags:['变量提升','作用域','TDZ'],
 fu:[{q:`追问：函数声明和函数表达式在提升上有什么不同？`, a:`函数声明整体提升，声明前就能调用；函数表达式只提升变量名，声明前调用会因为值是 undefined 而报 not a function。同名冲突时，函数声明优先于 var 声明。`},
   {q:`追问：作用域链是怎么查找变量的？`, a:`从当前词法环境开始，沿外层环境逐级向上查找，命中第一个就停止，一直到全局仍未找到则抛 ReferenceError。关键点是这条路径由代码的定义位置决定，与调用位置无关，所以叫词法作用域。`},
   {q:`追问：为什么说 let 也提升，但表现像没提升？`, a:`let / const 确实被提升并创建了绑定，只是绑定在初始化前处于 TDZ，访问就报错，所以表现上"像没提升"。理解这点才能解释为什么 typeof 也会抛错。`}]},


{c:'js', lv:'进阶', q:'call、apply、bind 有什么区别？手写一个 bind。',
 h:'前两个立即执行，bind 返回新函数；参数传递方式一个展开一个数组。',
 a:`<ul>
<li><b>call(thisArg, a, b)：</b>立即执行，参数逐个传。</li>
<li><b>apply(thisArg, [a, b])：</b>立即执行，参数以数组传。常用于 Math.max.apply(null, arr)。</li>
<li><b>bind(thisArg, a)：</b>返回一个绑定了 this 的新函数，不立即执行，支持柯里化预设参数。</li>
</ul>
<pre><code>Function.prototype.myBind = function (ctx, ...args) {
  const fn = this;
  return function (...inner) {
    // 处理 new 调用：new 时 this 应指向新对象
    if (new.target) return new fn(...args, ...inner);
    return fn.apply(ctx, [...args, ...inner]);
  };
};</code></pre>
<p><b>注意点：</b>bind 的 this 一旦绑定不可再被 call / apply 覆盖；箭头函数无法被 bind 改变 this。</p>`,
 tags:['call','apply','bind','this'],
 fu:[{q:`追问：手写 bind 要考虑哪几件事？`, a:`① 返回新函数且 this 指向目标对象；② 支持参数预置（柯里化）；③ 用 new 调用新函数时，this 应指向新实例而不是被绑定的对象；④ 保留原函数的 prototype，保证 instanceof 还能用。`},
   {q:`追问：bind 产生的函数，还能被 call 改 this 吗？`, a:`不能。绑定函数的 [[BoundThis]] 不可被覆盖，再 call / apply 也改不了。但用 new 调用时优先级更高，this 会指向新创建的对象。`},
   {q:`追问：apply 的第二个参数除了数组还能传什么？`, a:`类数组对象也可以，只要带 length 属性，比如 arguments、DOM 的 NodeList。这也是 apply 与扩展运算符分工的一个常见场景。`}]},


{c:'js', lv:'基础', q:'ES6 带来了哪些常用新特性？',
 h:'按语言、数据结构、异步、模块四类归纳，别零散罗列。',
 a:`<ul>
<li><b>变量声明：</b>let / const 块级作用域</li>
<li><b>函数：</b>箭头函数、默认参数、剩余参数、展开运算符</li>
<li><b>字符串与模板：</b>模板字符串、includes / startsWith / padStart</li>
<li><b>数据结构：</b>Map、Set、WeakMap、WeakSet、Symbol</li>
<li><b>对象与数组：</b>解构赋值、Object.assign、Object.entries、简写属性、计算属性名</li>
<li><b>类：</b>class、extends、super、static</li>
<li><b>异步：</b>Promise、async / await、for...of</li>
<li><b>模块：</b>import / export</li>
<li><b>其他：</b>Proxy / Reflect、可选链 ?.、空值合并 ??、Array.flat</li>
</ul>
<p><b>记忆抓手：</b>面试被问到这类开放题，按上面四组结构回答，每组举一个你真实用过的例子，比堆砌名词有效得多。</p>`,
 tags:['ES6','解构','新特性'],
 fu:[{q:`追问：解构有哪些容易踩的坑？`, a:`对象解构按属性名匹配、与顺序无关，数组解构按位置；解构 null / undefined 会抛错，应给默认值兜底；对已声明的变量再解构，整个表达式要用括号包起来，否则会被解析成块语句。`},
   {q:`追问：可选链和空值合并有什么区别？`, a:`可选链 ?. 用于安全访问，只对 null / undefined 短路；空值合并 ?? 只在左侧是 null / undefined 时取右侧，能保留 0 和空字符串，比 || 更精确。`},
   {q:`追问：ES6 之后还有哪些值得关注的更新？`, a:`ES2020 的可选链、空值合并、BigInt；ES2021 的逻辑赋值运算符；ES2022 的顶层 await、类字段、数组 at；ES2023 的 findLast、toSorted（不改原数组）。了解语言在持续演进，比背版本号更重要。`}]},


{c:'js', lv:'高频', q:'箭头函数和普通函数有哪些区别？',
 h:'this、arguments、能否 new、能否作为 Generator，四条。',
 a:`<ol>
<li><b>this：</b>箭头函数没有自己的 this，捕获定义时外层作用域的 this，且无法被 call / apply / bind 改变。</li>
<li><b>arguments：</b>箭头函数没有 arguments 对象，需要用剩余参数 ...args。</li>
<li><b>构造函数：</b>箭头函数没有 prototype，不能作为构造函数，不能用 new 调用。</li>
<li><b>其他：</b>没有 super 和 new.target，不能定义为 Generator 函数。</li>
</ol>
<pre><code>const obj = {
  name: 'A',
  fn1: function () { return this.name; },   // 'A'（隐式绑定）
  fn2: () =&gt; this.name                      // undefined（继承外层，通常是 window）
};</code></pre>
<p><b>适用判断：</b>需要动态 this 时（对象方法、构造函数）用普通函数；需要固定外层 this 时（回调、setTimeout、数组方法内的回调）用箭头函数。</p>`,
 tags:['箭头函数','this','构造函数'],
 fu:[{q:`追问：箭头函数为什么不能当构造函数？`, a:`它没有自己的 this，也没有 prototype 属性和 [[Construct]] 内部方法，用 new 调用会直接抛 TypeError。`},
   {q:`追问：箭头函数有 arguments 吗？`, a:`没有自己的 arguments，用的是外层函数的。替代方案是剩余参数 ...args，它是真正的数组，还能直接用数组方法。`},
   {q:`追问：什么场合反而不该用箭头函数？`, a:`对象的方法（this 会指向外层而不是对象）、需要动态 this 的回调、需要 arguments 的场景、需要被 new 的场合。事件处理里若依赖 this 指向当前元素，也要用普通函数。`}]},


{c:'js', lv:'高频', q:'说说 DOM 事件流：捕获、目标、冒泡，以及事件委托的原理。',
 h:'事件流的三个阶段，以及为什么把监听挂在父元素上能处理子元素的事件。',
 a:`<p><b>事件流三阶段：</b>捕获阶段（window → 目标父级）、目标阶段、冒泡阶段（目标 → window）。addEventListener 第三个参数默认 false 表示在冒泡阶段触发，传 true 则在捕获阶段触发。</p>
<pre><code>el.addEventListener('click', handler);        // 冒泡
el.addEventListener('click', handler, true);  // 捕获
e.stopPropagation();                          // 阻止继续传播
e.preventDefault();                           // 阻止默认行为（如链接跳转）</code></pre>
<p><b>事件委托：</b>不在每个子元素上绑定监听，而是把监听绑定在共同父元素上，利用冒泡统一处理，通过 e.target 判断实际触发的元素。</p>
<pre><code>list.addEventListener('click', e =&gt; {
  const li = e.target.closest('li');
  if (li) console.log(li.dataset.id);
});</code></pre>
<p><b>优点：</b>只需一个监听器，减少内存占用；动态新增的子元素自动生效，无需重新绑定。注意 click、mousedown 等冒泡，而 focus、blur、mouseenter 不冒泡（focus 需用 focusin 替代）。</p>`,
 tags:['事件流','冒泡','事件委托'],
 fu:[{q:`追问：既然事件会冒泡，为什么还要用事件委托？`, a:`三个收益：监听器数量从 N 降到 1（长列表尤其明显）、动态新增的元素自动生效、解绑时只需处理一处。代价是要判断 e.target，且依赖冒泡——像 focus、blur 这类不冒泡的事件不能直接委托。`},
   {q:`追问：阻止传播的两种方式有什么区别？`, a:`stopPropagation 阻止事件继续向上冒泡或向下捕获；stopImmediatePropagation 还会阻止同一元素上其他监听器执行。注意 preventDefault 是取消默认行为，跟传播无关，两者常被混淆。`},
   {q:`追问：React 的事件机制和原生有什么不同？`, a:`React 自己做了一套合成事件与统一委托：17 之前委托在 document 上，17 起改为挂到根容器。这意味着在 React 里混用原生监听时要留意触发顺序与冒泡边界。`}]},


{c:'js', lv:'进阶', q:'Map 和普通对象的区别？什么场景应该用 Map？',
 h:'键的类型、顺序、性能、原型干扰，四个维度对比。',
 a:`<ul>
<li><b>键类型：</b>Object 的键只能是字符串或 Symbol，数字会被转成字符串；Map 的键可以是任意类型，包括对象和函数。</li>
<li><b>顺序：</b>Map 严格保持插入顺序；Object 的字符串键在 ES6 后基本按插入顺序，但整数键会被提前排序。</li>
<li><b>大小：</b>Map 有 size 属性；Object 需要 Object.keys(obj).length。</li>
<li><b>原型干扰：</b>Object 有原型链，直接遍历可能拿到继承来的属性；Map 没有这个问题。</li>
<li><b>性能：</b>频繁增删键值对时 Map 表现更好；纯数据存储且键固定时 Object 也够用。</li>
</ul>
<pre><code>const m = new Map();
const key = {};
m.set(key, 'value');   // 对象作键
m.get(key);            // 'value'
m.has(key); m.delete(key); m.clear();
for (const [k, v] of m) {}</code></pre>
<p><b>WeakMap：</b>键必须是对象，且是弱引用——键对象被回收后条目自动消失，因此不可遍历、没有 size。适合给 DOM 节点挂私有数据、做缓存避免泄漏。</p>`,
 tags:['Map','WeakMap'],
 fu:[{q:`追问：什么场景必须用 Map？`, a:`键不是字符串或 Symbol 时（对象、函数做键）；键需要按插入顺序稳定遍历；键的数量大且频繁增删（对象在频繁增删下性能更差）；需要直接拿到数量（Map 有 size，对象要 Object.keys 再取长度）。`},
   {q:`追问：WeakMap 的键有什么限制？`, a:`键必须是对象，且是弱引用——键被回收后对应条目自动消失，因此它不可遍历、没有 size。适合给对象挂私有数据、做缓存或关联元信息，天然避免内存泄漏。`},
   {q:`追问：Map 能直接 JSON.stringify 吗？`, a:`不能，会被序列化成空对象。要转就手动转成数组，比如 Object.fromEntries(map)，或者先把键统一成字符串。这是两者互换时最常见的坑。`}]},


{c:'js', lv:'基础', q:'什么是柯里化（currying）？手写一个通用的 curry 函数。',
 h:'把多参数函数拆成一系列单参数函数，核心是"参数够了才执行"。',
 a:`<p><b>定义：</b>把接收多个参数的函数，转换成一系列只接收一个参数的函数，通过闭包累积参数，直到参数个数足够再执行。</p>
<pre><code>function curry(fn) {
  return function curried(...args) {
    if (args.length &gt;= fn.length) return fn.apply(this, args);
    return (...rest) =&gt; curried.apply(this, [...args, ...rest]);
  };
}
const add = curry((a, b, c) =&gt; a + b + c);
add(1)(2)(3);   // 6
add(1, 2)(3);   // 6
add(1)(2, 3);   // 6</code></pre>
<p>注意这里用 <code>fn.length</code> 来判断参数是否收集完毕，它表示形参个数，不包括剩余参数和默认值参数。</p>
<p><b>用途：</b>参数复用与预设（如把通用的请求函数柯里化成 get / post）、延迟执行、配合函数组合 compose。</p>`,
 tags:['柯里化','闭包','函数式'],
 fu:[{q:`追问：柯里化有什么实际价值？`, a:`参数复用（固定部分参数生成专用函数）、延迟执行、以及让函数更容易组合——函数式里的 pipe / compose 依赖单参函数。前端常见于工具函数定制和中间件风格的调用。`},
   {q:`追问：怎么判断参数够了可以执行？`, a:`靠原函数的 length（形参个数）与已收集的参数个数比较。注意 length 不包含剩余参数和有默认值的参数，这是手写时最容易出错的边界。`},
   {q:`追问：它和部分应用（partial application）是一回事吗？`, a:`不是。柯里化强调的是"每次只收一个参数"的调用形式，部分应用是预先固定任意几个参数。实践中常被混着叫，但概念要分清。`}]},
